[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-oss-api"
version = "0.1.0"
description = "Backend API and data adapters for the OSS supply-chain early-warning board."
requires-python = ">=3.11"
dependencies = [
  "cryptography>=46,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "packaging>=24,<26",
  "pydantic-settings>=2.7,<3",
  "semantic-version>=2.10,<3",
  "snowflake-connector-python>=3.12,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
sentinel-ingest = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
